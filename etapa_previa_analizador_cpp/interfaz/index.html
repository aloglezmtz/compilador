<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de compiladores</title>
<style>
:root{--bg:#0d1117;--p:#161b22;--b:#30363d;--t:#c9d1d9;--d:#8b949e;--g:#3fb950;--r:#f85149;--a:#d29922;--u:#58a6ff;--m:#d2a8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--p);border-bottom:1px solid var(--b)}
header h1{font-size:15px;margin:0;font-weight:600}header span.s{color:var(--d);font-size:12px}
.chip{font:12px ui-monospace,Consolas,monospace;padding:2px 8px;border-radius:10px;border:1px solid var(--b);color:var(--d)}.chip.ok{color:var(--g);border-color:#238636}.chip.no{color:var(--r);border-color:#da3633}
main{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:12px;padding:12px;min-height:0}
section{background:var(--p);border:1px solid var(--b);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--b)}.bar b{font-size:12px;color:var(--d);text-transform:uppercase;letter-spacing:.05em}.sp{flex:1}
button,select{background:#21262d;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:5px 11px;font:inherit;cursor:pointer}button:hover{border-color:var(--u)}
button.go{background:#238636;border-color:#2ea043;color:#fff}button.go:hover{background:#2ea043}
#ed{flex:1;display:flex;min-height:0;font:13px/20px ui-monospace,Consolas,monospace}
#gut{width:48px;padding:10px 6px;text-align:right;color:#484f58;overflow:hidden;background:#0d1117;border-right:1px solid var(--b);user-select:none;white-space:pre}
#gut i{display:block;font-style:normal;height:20px}#gut i.e{color:#fff;background:#da3633;border-radius:3px}
#code{flex:1;resize:none;border:0;outline:0;background:var(--bg);color:var(--t);padding:10px;font:inherit;white-space:pre;tab-size:4;overflow:auto}
#pasos{padding:10px;display:grid;gap:8px}.fila{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.fila em{font-style:normal;color:var(--d);width:110px;font-size:12px}
#log{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--b);border-radius:6px;background:var(--bg)}.card h4{margin:0;padding:6px 10px;font:12px ui-monospace,Consolas,monospace;display:flex;gap:8px;border-bottom:1px solid var(--b)}
.card h4 .c{flex:1;color:var(--u);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ok{color:var(--g)}.no{color:var(--r)}
pre{margin:0;padding:8px 10px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.L.r{color:var(--r)}.L.a{color:var(--a)}.L.g{color:var(--g)}.L.d{color:var(--d)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.v{padding:8px 10px;font-weight:600}
@media(max-width:900px){main{grid-template-columns:1fr;overflow:auto}}
</style></head><body>
<header><h1>🧪 Laboratorio de compiladores</h1><span class="s">Analizador léxico y sintáctico · C++ y flex/bison</span><span class="sp" style="flex:1"></span><span id="env"></span></header>
<main>
<section>
  <div class="bar"><b>Código</b><select id="sel"></select><button id="nuevo">+ Nuevo .c</button><span class="sp"></span><span id="est" class="chip">sin cambios</span><button id="gd">Guardar (Ctrl+S)</button></div>
  <div id="ed"><div id="gut"></div><textarea id="code" spellcheck="false"></textarea></div>
</section>
<section>
  <div class="bar"><b>Pasos manuales</b><span class="sp"></span><button id="lim">Limpiar</button></div>
  <div id="pasos">
    <div class="fila"><em>Versión C++</em><button data-p="g++">1 · g++ compilar</button><button data-p="cpp" class="go">2 · Ejecutar</button><button data-p="tokens">Tokens</button></div>
    <div class="fila"><em>flex + bison</em><button data-p="bison">1 · bison</button><button data-p="flex">2 · flex</button><button data-p="gcc">3 · gcc</button><button data-p="bis" class="go">4 · Ejecutar</button></div>
    <div class="fila"><em>Atajos</em><button id="todo">Compilar y ejecutar todo</button><button id="cmp">⚖ Comparar C++ vs bison</button></div>
  </div>
  <div id="log"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);let actual="",ultimoC="prueba.c",sucio=false,errs=new Set();
const api=(u,b)=>fetch(u,b?{method:"POST",headers:{"X-Req":"1","Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json());
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function gut(){const n=$("#code").value.split("\n").length;$("#gut").innerHTML=Array.from({length:n},(_,i)=>`<i class="${errs.has(i+1)?"e":""}">${i+1}</i>`).join("");$("#gut").scrollTop=$("#code").scrollTop}
function estado(){$("#est").textContent=sucio?"● sin guardar":"guardado";$("#est").className="chip "+(sucio?"no":"ok")}
async function abrir(n){if(sucio)await guardar();actual=n;if(n.endsWith(".c"))ultimoC=n;$("#sel").value=n;errs=new Set();
 $("#code").value=(await api("/api/archivo?n="+encodeURIComponent(n))).contenido;sucio=false;estado();gut()}
async function guardar(){if(!actual)return;await api("/api/guardar",{nombre:actual,contenido:$("#code").value});sucio=false;estado()}
async function lista(sel){const l=await api("/api/archivos");$("#sel").innerHTML=l.map(f=>`<option>${f}</option>`).join("");if(sel)$("#sel").value=sel}
function lineas(t){return esc(t).split("\n").map(l=>{const c=/❌/.test(l)?"r":/⚠/.test(l)?"a":/✅/.test(l)?"g":/^\s*(\$|cd |g\+\+)/.test(l)?"d":"";return `<div class="L ${c}">${l||" "}</div>`}).join("")}
function marcar(o){errs=new Set();for(const m of o.matchAll(/[Ll][ií]nea (\d+)/g))errs.add(+m[1]);gut()}
function tarjeta(nombre,r){const d=document.createElement("div");d.className="card";
 d.innerHTML=`<h4><span class="${r.ok?"ok":"no"}">${r.ok?"✔":"✘"} ${nombre}</span><span class="c">$ ${esc(r.cmd||"")}</span><span style="color:var(--d)">${r.ms} ms</span></h4><pre>${lineas(r.out||"(sin salida)")}</pre>`;
 $("#log").prepend(d);return d}
const NOM={"g++":"g++","cpp":"Ejecutar C++",tokens:"Tokens",bison:"bison",flex:"flex",gcc:"gcc",bis:"Ejecutar bison"};
async function paso(p){await guardar();const r=await api("/api/paso",{paso:p,archivo:ultimoC});
 if(p==="cpp"||p==="bis"){marcar(r.out||"")}
 if(r.error)r.out=r.error;if(p==="cpp"||p==="bis")r.ok=/ACCEPT/.test(r.out)||r.ok&&!/❌/.test(r.out);tarjeta(`${NOM[p]} (${p==="cpp"||p==="bis"||p==="tokens"?ultimoC:"…"})`,r);return r}
async function todo(){for(const p of["g++","cpp","bison","flex","gcc","bis"]){const r=await paso(p);if(!r.ok&&["g++","bison","flex","gcc"].includes(p))break}}
async function comparar(){await guardar();const a=await api("/api/paso",{paso:"cpp",archivo:ultimoC}),b=await api("/api/paso",{paso:"bis",archivo:ultimoC});
 const igual=a.out.trim()===b.out.trim(),d=document.createElement("div");d.className="card";
 d.innerHTML=`<h4><span class="${igual?"ok":"a"}">⚖ Comparación (${ultimoC})</span></h4><div class="cmp"><div><h4 style="border-top:0"><span>C++</span></h4><pre>${lineas(a.out)}</pre></div><div><h4 style="border-top:0"><span>flex + bison</span></h4><pre>${lineas(b.out)}</pre></div></div><div class="v ${igual?"ok":""}" style="${igual?"":"color:var(--a)"}">${igual?"✅ Salidas idénticas":"≠ Las salidas difieren (revisa el orden o la recuperación de errores)"}</div>`;$("#log").prepend(d)}
$("#code").oninput=()=>{sucio=true;estado();gut()};$("#code").onscroll=()=>$("#gut").scrollTop=$("#code").scrollTop;
$("#code").onkeydown=e=>{if(e.key==="Tab"){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText("    ",s,t.selectionEnd,"end");t.oninput()}if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();guardar()}};
$("#sel").onchange=e=>abrir(e.target.value);$("#gd").onclick=guardar;$("#lim").onclick=()=>{$("#log").innerHTML="";errs=new Set();gut()};
$("#todo").onclick=todo;$("#cmp").onclick=comparar;document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>paso(b.dataset.p));
$("#nuevo").onclick=async()=>{let n=prompt("Nombre del archivo (ej. mio.c):","mio.c");if(!n)return;if(!n.endsWith(".c"))n+=".c";
 const r=await api("/api/guardar",{nombre:n,contenido:"#include <stdio.h>\n\nint main () {\n    return 0;\n}\n"});if(r.error)return alert(r.error);await lista(n);abrir(n)};
(async()=>{await lista();await abrir("prueba.c");const e=await api("/api/entorno");
 $("#env").innerHTML=["g++","gcc","flex","bison"].map(t=>`<span class="chip ${e[t]==="1"?"ok":"no"}">${t}</span> `).join("")})();
</script></body></html>
